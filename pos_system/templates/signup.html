<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פתיחת חשבון | ארנט</title>
<style>
  :root{
    --bg:#F4F5F3; --surface:#FFFFFF; --ink:#16211C; --ink-soft:#5B655E; --line:#DBDED6;
    --teal:#0F5C48; --teal-deep:#0A3F32; --red:#B23A2E; --red-tint:#FBE7E4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Heebo,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px;width:360px;max-width:90vw;}
  h1{font-size:20px;margin:0 0 4px;text-align:center;}
  .sub{color:var(--ink-soft);font-size:13px;text-align:center;margin:0 0 22px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:14px;}
  input:focus{outline:none;border-color:var(--teal);}
  button{width:100%;background:var(--teal);color:#fff;border:none;border-radius:7px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{background:var(--teal-deep);}
  .error{background:var(--red-tint);color:var(--red);border-radius:7px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
  .price-box{background:var(--teal-tint,#E1F0EA);color:var(--teal-deep);border-radius:8px;padding:10px 14px;text-align:center;font-size:14px;margin-bottom:18px;}
  .price-box span{font-size:11px;opacity:.8;}
  .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <h1>פתיחת חשבון חדש</h1>
    <p class="sub">חשבון נפרד ומבודד לחנות שלכם - רק אתם תראו את המלאי והמכירות שלכם.</p>
    <div class="price-box">מנוי חודשי: <b>400 ₪</b><br><span>כולל 14 ימי ניסיון חופשי, ללא כרטיס אשראי</span></div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>שם העסק / החנות</label>
      <input name="store_name" autofocus>
      <label>שם משתמש (לכניסה למערכת)</label>
      <input name="username" autocomplete="username">
      <label>סיסמה (לפחות 4 תווים)</label>
      <input name="password" type="password" autocomplete="new-password">
      <button type="submit">פתיחת חשבון</button>
    </form>
    <a href="/login" class="back">כבר יש לי חשבון - כניסה</a>
  </div>
</body>
</html>
