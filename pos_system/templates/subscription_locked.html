<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המנוי לא פעיל | ארנט</title>
<style>
  :root{
    --bg:#F4F5F3; --surface:#FFFFFF; --ink:#16211C; --ink-soft:#5B655E; --line:#DBDED6;
    --teal:#0F5C48; --teal-deep:#0A3F32; --amber:#B4680B; --amber-tint:#FBEBD6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Heebo,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px;max-width:420px;}
  .badge{display:inline-block;background:var(--amber-tint);color:var(--amber);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;margin-bottom:16px;}
  h1{font-size:20px;margin:0 0 10px;}
  p{color:var(--ink-soft);font-size:14px;line-height:1.6;}
  .price{font-size:28px;font-weight:800;color:var(--teal-deep);margin:18px 0;}
  a.logout{display:inline-block;margin-top:20px;color:var(--ink-soft);font-size:13px;text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">{{ reason }}</div>
    <h1>המנוי לחשבון "{{ store.name if store else '' }}" אינו פעיל</h1>
    <p>כדי להמשיך להשתמש בקופה, במלאי ובדוחות, יש לחדש את המנוי.</p>
    <div class="price">400 ₪ / חודש</div>
    <p>לחידוש המנוי, צרו קשר עם בעל המערכת. ברגע שהתשלום יתקבל, הגישה תשוחזר אוטומטית.</p>
    <a href="/logout" class="logout">התנתקות</a>
  </div>
</body>
</html>
